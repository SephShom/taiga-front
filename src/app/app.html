<tui-root class="host">
  <!-- ======================== TOP BAR ======================== -->
  <header class="top-bar">
    <div class="bar-start">
      <button
        class="menu-toggle"
        (click)="toggleSidebar()"
        aria-label="Toggle navigation"
      >
        <tui-icon class="bar-icon" icon="@tui.align-justify"></tui-icon>
      </button>

      <div class="brand">
        <span class="brand-mark">T</span>
        <span class="brand-name">
          Taiga<span class="brand-accent">Dash</span>
        </span>
      </div>
    </div>

    <div class="bar-center hidden-lg">
      <div class="search-wrap">
        <tui-icon class="search-icon" icon="@tui.search"></tui-icon>
        <input
          type="search"
          placeholder="Search customers, orders, reports…"
          class="search-input"
          aria-label="Global search"
        />
      </div>
    </div>

    <div class="bar-end">
      <button
        class="icon-btn relative"
        aria-label="Notifications"
        [attr.aria-pressed]="false"
      >
        <tui-icon class="bar-icon" icon="@tui.bell"></tui-icon>
        <span class="notif-badge">3</span>
      </button>
      <button
        class="icon-btn profile-btn"
        (click)="collapsed.set(false)"
        aria-label="User profile"
      >
        <div tuiAvatar class="profile-avatar" size="l">{{
          userInitial()
        }}</div>
      </button>
    </div>
  </header>

  <!-- ======================== BODY (SIDEBAR + CONTENT) ======================== -->
  <div class="dashboard-body">
    <aside class="sidebar" [class.collapsed]="collapsed()">
      <div class="sidebar-header">
        <span class="brand-mark">T</span>
        <span class="brand-text">
          Taiga<span class="brand-accent">Dash</span>
        </span>
      </div>

      <nav class="sidebar-nav" aria-label="Main navigation">
        @for (item of menuItems(); track item.route) {
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            class="nav-item"
            [attr.aria-current]="isRouteActive(item.route) ? 'page' : null"
          >
            <tui-icon class="nav-icon" [icon]="item.icon"></tui-icon>
            <span class="nav-label">{{ item.label }}</span>
            @if (item.badge) {
              <div tuiBadge class="nav-badge appearance-accent">{{
                item.badge
              }}</div>
            }
          </a>
        }
      </nav>

      <div class="sidebar-spacer"></div>

      <div class="sidebar-footer">
        <button
          class="nav-item collapse-toggle"
          (click)="toggleSidebar()"
          [attr.title]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
          [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
        >
          <tui-icon
            class="nav-icon"
            [icon]="collapsed() ? '@tui.chevron-right' : '@tui.chevron-left'"
          ></tui-icon>
          <span class="nav-label">{{ collapsed() ? 'Expand' : 'Collapse' }}</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</tui-root>
